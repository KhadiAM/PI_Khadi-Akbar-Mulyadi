<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>{{ article.Judul }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Portal Berita</a>
      <form class="d-flex" action="{{ url_for('home') }}" method="get">
        <input class="form-control me-2" type="search" placeholder="Cari judul berita..." name="q">
        <button class="btn btn-outline-success" type="submit">Cari</button>
      </form>
    </div>
  </nav>

  <div class="container my-4">
    <a href="/" class="btn btn-secondary mb-4">&larr; Kembali ke Beranda</a>
    <h1 class="mb-3">{{ article.Judul }}</h1>
    <p class="text-muted">Waktu: {{ article.Waktu }}</p>
    <img src="https://source.unsplash.com/800x400/?article,{{ article.Judul | urlencode }}" class="img-fluid rounded my-3" alt="Gambar Ilustrasi">
    <div class="fs-5" style="white-space: pre-wrap;">{{ article.Content }}</div>
  </div>

  <div class="container my-5">
    <hr>
    <h2 class="mt-5 mb-4">Rekomendasi Berita Lainnya</h2>
    <div class="row">
      {% for rec in recommendations %}
      <div class="col-12 col-md-6 col-lg-4 mb-4">
        <div class="card h-100 shadow-sm">
          <img src="https://source.unsplash.com/600x400/?technology,{{ loop.index }}" class="card-img-top" alt="Gambar Berita">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">
              <a href="/detail/{{ rec.Judul }}">{{ rec.Judul }}</a>
            </h5>
            <p class="card-text text-muted flex-grow-1">{{ rec.Content[:120] }}...</p>
            <a href="/detail/{{ rec.Judul }}" class="btn btn-primary mt-auto">Baca Selengkapnya</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

  <footer class="text-center text-muted py-4 mt-4 bg-light">
    <p>&copy; 2025 Proyek Sistem Rekomendasi</p>
  </footer>

</body>
</html>
